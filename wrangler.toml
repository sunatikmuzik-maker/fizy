# FIZY Journal — конфигурация для Cloudflare Workers (статика + API).
name = "fizy"
main = "worker.mjs"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
PUBLIC_URL = "https://fizy.sunatikmuzik.workers.dev"
ALLOW_SIGNUP = "1"
FIZY_STORE_NAME = "fizy-journal-v1"

# KV-хранилища. Создай три namespace в панели (Storage & databases → KV)
# и вставь их id сюда вместо заглушек.
[[kv_namespaces]]
binding = "FIZY_KV"
id = "2c6573dcf6ca404a83d21048993b0543"

[[kv_namespaces]]
binding = "FIZY_KV_RATE"
id = "7dbcabcf7300420d9e934a9fdb8f44aa"

[[kv_namespaces]]
binding = "FIZY_KV_COMMUNITY"
id = "47a7d2c1d74c43f7bb54b1d9422bffe4"
