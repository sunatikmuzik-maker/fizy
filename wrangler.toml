# FIZY Journal — конфигурация для Cloudflare Workers (статика + API).
name = "fizy"
main = "worker.mjs"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
PUBLIC_URL = "https://fizy.rjournal.workers.dev"
ALLOW_SIGNUP = "1"
FIZY_STORE_NAME = "fizy-journal-v1"

# KV-хранилища. Создай три namespace в панели (Storage & databases → KV)
# и вставь их id сюда вместо заглушек.
[[kv_namespaces]]
binding = "FIZY_KV"
id = "PUT_MAIN_KV_ID_HERE"

[[kv_namespaces]]
binding = "FIZY_KV_RATE"
id = "PUT_RATE_KV_ID_HERE"

[[kv_namespaces]]
binding = "FIZY_KV_COMMUNITY"
id = "PUT_COMMUNITY_KV_ID_HERE"
